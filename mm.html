</head>
<body>

    <h1>Bố cục trang web với display</h1>

    <!-- Thanh điều hướng dùng inline-block -->

    <!-- Khối nội dung chứa 3 cột đặt nằm ngang -->

        <div class="box">
            <h2>Cột 1</h2>
            <p>Nội dung mô tả cho cột thứ nhất.</p>
        </div>
        <div class="box">
            <h2>Cột 2</h2>
            <p>Nội dung mô tả cho cột thứ hai.</p>
        </div>
        <div class="box">
            <h2>Cột 3</h2>
            <p>Nội dung mô tả cho cột thứ ba.</p>
        </div>
    </section>

    <!-- Chân trang -->
    <footer>
        <p>Bản quyền &copy; 2026 CodeGym Practice</p>
    </footer>
